<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">全局资源搜索结果页示意图</title>
  <desc id="desc">页面包含顶栏搜索框、搜索输入、范围与资源类型筛选、集群状态、按类型分组的结果列表。</desc>

  <rect width="1200" height="780" fill="#f3f4f6"/>

  <!-- Masthead -->
  <rect width="1200" height="56" fill="#151515"/>
  <rect x="360" y="12" width="480" height="32" rx="16" fill="#2b2d31" stroke="#4b4d52"/>
  <text x="380" y="33" font-family="sans-serif" font-size="14" fill="#9aa0a6">Search resources...</text>
  <circle cx="1104" cy="28" r="10" fill="#3c3f44"/>
  <circle cx="1146" cy="28" r="10" fill="#3c3f44"/>

  <!-- Page heading -->
  <text x="48" y="116" font-family="sans-serif" font-size="28" font-weight="700" fill="#151515">Search</text>
  <text x="48" y="146" font-family="sans-serif" font-size="14" fill="#6a6e73">Search across clusters by name, IP, namespace, label, or app</text>

  <!-- Search input -->
  <rect x="48" y="168" width="700" height="44" rx="6" fill="#ffffff" stroke="#0066cc" stroke-width="2"/>
  <text x="68" y="195" font-family="sans-serif" font-size="16" fill="#151515">nginx</text>
  <text x="716" y="195" font-family="sans-serif" font-size="16" fill="#9aa0a6">×</text>
  <rect x="764" y="168" width="110" height="44" rx="6" fill="#0066cc"/>
  <text x="789" y="195" font-family="sans-serif" font-size="15" fill="#ffffff">Search</text>

  <!-- Filters -->
  <text x="48" y="242" font-family="sans-serif" font-size="12" fill="#6a6e73">Search scope</text>
  <rect x="48" y="250" width="250" height="36" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="62" y="273" font-family="sans-serif" font-size="13" fill="#151515">All clusters and namespaces</text>
  <text x="282" y="273" font-family="sans-serif" font-size="12" fill="#6a6e73">▾</text>

  <text x="320" y="242" font-family="sans-serif" font-size="12" fill="#6a6e73">Resource type</text>
  <rect x="320" y="250" width="190" height="36" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="334" y="273" font-family="sans-serif" font-size="13" fill="#151515">All resource types</text>
  <text x="494" y="273" font-family="sans-serif" font-size="12" fill="#6a6e73">▾</text>

  <!-- Cluster status -->
  <text x="48" y="322" font-family="sans-serif" font-size="12" fill="#6a6e73">Clusters:</text>
  <rect x="110" y="306" width="92" height="24" rx="12" fill="#e7f5ec" stroke="#3e8635"/>
  <text x="128" y="322" font-family="sans-serif" font-size="12" fill="#1e4f18">Available</text>
  <rect x="210" y="306" width="82" height="24" rx="12" fill="#fdf3e3" stroke="#c58c00"/>
  <text x="230" y="322" font-family="sans-serif" font-size="12" fill="#7a5200">Partial</text>
  <rect x="300" y="306" width="98" height="24" rx="12" fill="#faeae8" stroke="#c9190b"/>
  <text x="316" y="322" font-family="sans-serif" font-size="12" fill="#8a1207">Forbidden</text>
  <rect x="406" y="306" width="94" height="24" rx="12" fill="#f0f0f0" stroke="#8a8d90"/>
  <text x="423" y="322" font-family="sans-serif" font-size="12" fill="#4f5255">Timed out</text>

  <!-- Alerts -->
  <rect x="48" y="344" width="1104" height="36" rx="4" fill="#fdf3e3" stroke="#f0ab00"/>
  <text x="64" y="367" font-family="sans-serif" font-size="13" fill="#7a5200">Some clusters could not be searched. Results from the remaining clusters are shown below.</text>

  <!-- Pods group -->
  <text x="48" y="414" font-family="sans-serif" font-size="18" font-weight="700" fill="#151515">Pods</text>
  <rect x="104" y="399" width="26" height="20" rx="10" fill="#e7f1fa"/>
  <text x="115" y="413" font-family="sans-serif" font-size="12" fill="#004080">3</text>
  <text x="1004" y="414" font-family="sans-serif" font-size="12" fill="#6a6e73">3 results in 128 ms</text>

  <g>
    <rect x="48" y="428" width="1104" height="68" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
    <circle cx="74" cy="462" r="12" fill="#e7f1fa"/>
    <text x="100" y="456" font-family="sans-serif" font-size="14" font-weight="700" fill="#151515">nginx-7d9f8c-abcde</text>
    <text x="100" y="476" font-family="sans-serif" font-size="12" fill="#6a6e73">web · prod-cluster · Pod · 10.0.0.12</text>
    <rect x="1010" y="448" width="72" height="24" rx="12" fill="#e7f5ec"/>
    <text x="1027" y="464" font-family="sans-serif" font-size="12" fill="#1e4f18">Running</text>
    <text x="1112" y="464" font-family="sans-serif" font-size="16" fill="#6a6e73">›</text>
  </g>

  <g>
    <rect x="48" y="504" width="1104" height="68" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
    <circle cx="74" cy="538" r="12" fill="#e7f1fa"/>
    <text x="100" y="532" font-family="sans-serif" font-size="14" font-weight="700" fill="#151515">nginx-7d9f8c-fghij</text>
    <text x="100" y="552" font-family="sans-serif" font-size="12" fill="#6a6e73">web · stage-cluster · Pod · 10.1.4.31</text>
    <rect x="1010" y="524" width="72" height="24" rx="12" fill="#e7f5ec"/>
    <text x="1027" y="540" font-family="sans-serif" font-size="12" fill="#1e4f18">Running</text>
    <text x="1112" y="540" font-family="sans-serif" font-size="16" fill="#6a6e73">›</text>
  </g>

  <g>
    <rect x="48" y="580" width="1104" height="68" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
    <circle cx="74" cy="614" r="12" fill="#e7f1fa"/>
    <text x="100" y="608" font-family="sans-serif" font-size="14" font-weight="700" fill="#151515">nginx-7d9f8c-klmno</text>
    <text x="100" y="628" font-family="sans-serif" font-size="12" fill="#6a6e73">web · dev-cluster · Pod · 10.0.0.77</text>
    <rect x="1010" y="600" width="72" height="24" rx="12" fill="#fdf3e3"/>
    <text x="1029" y="616" font-family="sans-serif" font-size="12" fill="#7a5200">Pending</text>
    <text x="1112" y="616" font-family="sans-serif" font-size="16" fill="#6a6e73">›</text>
  </g>

  <!-- Services group -->
  <text x="48" y="690" font-family="sans-serif" font-size="18" font-weight="700" fill="#151515">Services</text>
  <rect x="126" y="675" width="26" height="20" rx="10" fill="#e7f1fa"/>
  <text x="137" y="689" font-family="sans-serif" font-size="12" fill="#004080">1</text>

  <g>
    <rect x="48" y="704" width="1104" height="60" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
    <circle cx="74" cy="734" r="12" fill="#e7f1fa"/>
    <text x="100" y="730" font-family="sans-serif" font-size="14" font-weight="700" fill="#151515">nginx</text>
    <text x="100" y="750" font-family="sans-serif" font-size="12" fill="#6a6e73">web · prod-cluster · Service · 10.96.12.8</text>
    <rect x="1010" y="722" width="72" height="24" rx="12" fill="#e7f1fa"/>
    <text x="1022" y="738" font-family="sans-serif" font-size="12" fill="#004080">ClusterIP</text>
  </g>
</svg>
