<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">创建保密字典表单示意图</title>
  <desc id="desc">左侧为名称、命名空间、数据类型与键值对编辑区，右侧为 Secret 类型说明与三种引用方式。</desc>

  <rect width="1200" height="800" fill="#f3f4f6"/>

  <!-- Masthead -->
  <rect width="1200" height="56" fill="#151515"/>
  <text x="48" y="35" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">KDO 控制台</text>
  <text x="990" y="35" font-family="sans-serif" font-size="12" fill="#9aa0a6">配置管理 / 保密字典</text>

  <!-- Heading -->
  <text x="48" y="110" font-family="sans-serif" font-size="28" font-weight="700" fill="#151515">新建保密字典</text>
  <text x="48" y="136" font-family="sans-serif" font-size="14" fill="#6a6e73">敏感数据与镜像解耦，创建后可被容器组以多种方式引用。</text>

  <!-- Form card -->
  <rect x="48" y="164" width="720" height="580" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="72" y="198" font-family="sans-serif" font-size="17" font-weight="700" fill="#151515">基本信息</text>

  <text x="72" y="244" font-family="sans-serif" font-size="12" fill="#6a6e73">名称 *</text>
  <rect x="72" y="252" width="260" height="34" rx="4" fill="#ffffff" stroke="#0066cc" stroke-width="2"/>
  <text x="86" y="274" font-family="sans-serif" font-size="13" fill="#151515">db-secret</text>

  <text x="352" y="244" font-family="sans-serif" font-size="12" fill="#6a6e73">命名空间 *</text>
  <rect x="352" y="252" width="392" height="34" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="366" y="274" font-family="sans-serif" font-size="13" fill="#151515">default</text>
  <text x="720" y="274" font-family="sans-serif" font-size="12" fill="#6a6e73">▾</text>

  <text x="72" y="316" font-family="sans-serif" font-size="12" fill="#6a6e73">数据类型</text>
  <circle cx="80" cy="334" r="7" fill="#ffffff" stroke="#0066cc" stroke-width="2"/>
  <circle cx="80" cy="334" r="3" fill="#0066cc"/>
  <text x="96" y="339" font-family="sans-serif" font-size="12" fill="#151515">键值对</text>
  <circle cx="200" cy="334" r="7" fill="#ffffff" stroke="#8a8d90"/>
  <text x="216" y="339" font-family="sans-serif" font-size="12" fill="#151515">文件上传</text>

  <text x="72" y="380" font-family="sans-serif" font-size="12" fill="#6a6e73">数据</text>
  <text x="694" y="380" font-family="sans-serif" font-size="12" fill="#0066cc">＋ 添加一行</text>

  <rect x="72" y="390" width="672" height="172" rx="4" fill="#ffffff" stroke="#e0e0e0"/>
  <rect x="72" y="390" width="672" height="32" rx="4" fill="#f3f4f6"/>
  <text x="86" y="411" font-family="sans-serif" font-size="11" fill="#6a6e73">键</text>
  <text x="330" y="411" font-family="sans-serif" font-size="11" fill="#6a6e73">值</text>
  <text x="640" y="411" font-family="sans-serif" font-size="11" fill="#6a6e73">操作</text>

  <line x1="72" y1="422" x2="744" y2="422" stroke="#e0e0e0"/>
  <text x="86" y="446" font-family="monospace" font-size="12" fill="#151515">username</text>
  <text x="330" y="446" font-family="monospace" font-size="12" fill="#6a6e73">••••••••</text>
  <text x="640" y="446" font-family="sans-serif" font-size="11" fill="#0066cc">显示</text>

  <line x1="72" y1="456" x2="744" y2="456" stroke="#e0e0e0"/>
  <text x="86" y="480" font-family="monospace" font-size="12" fill="#151515">password</text>
  <text x="330" y="480" font-family="monospace" font-size="12" fill="#6a6e73">••••••••</text>
  <text x="640" y="480" font-family="sans-serif" font-size="11" fill="#0066cc">显示</text>

  <line x1="72" y1="490" x2="744" y2="490" stroke="#e0e0e0"/>
  <text x="86" y="514" font-family="monospace" font-size="12" fill="#151515">api-token</text>
  <text x="330" y="514" font-family="monospace" font-size="12" fill="#6a6e73">••••••••</text>
  <text x="640" y="514" font-family="sans-serif" font-size="11" fill="#0066cc">显示</text>
  <line x1="72" y1="524" x2="744" y2="524" stroke="#e0e0e0"/>

  <text x="72" y="588" font-family="sans-serif" font-size="11" fill="#6a6e73">值以 base64 编码保存，界面可切换显示明文。</text>
  <text x="72" y="610" font-family="sans-serif" font-size="11" fill="#6a6e73">单个 Secret 大小上限为 1 MB。</text>

  <rect x="72" y="660" width="86" height="32" rx="4" fill="#0066cc"/>
  <text x="103" y="681" font-family="sans-serif" font-size="13" fill="#ffffff">添加</text>
  <rect x="170" y="660" width="86" height="32" rx="4" fill="#ffffff" stroke="#0066cc"/>
  <text x="201" y="681" font-family="sans-serif" font-size="13" fill="#0066cc">取消</text>

  <!-- Types card -->
  <rect x="792" y="164" width="360" height="260" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="816" y="198" font-family="sans-serif" font-size="15" font-weight="700" fill="#151515">Secret 类型</text>

  <text x="816" y="230" font-family="monospace" font-size="12" fill="#151515">Opaque</text>
  <text x="816" y="248" font-family="sans-serif" font-size="11" fill="#6a6e73">通用键值对</text>

  <text x="816" y="276" font-family="monospace" font-size="12" fill="#151515">kubernetes.io/tls</text>
  <text x="816" y="294" font-family="sans-serif" font-size="11" fill="#6a6e73">TLS 证书与私钥</text>

  <text x="816" y="322" font-family="monospace" font-size="12" fill="#151515">kubernetes.io/dockerconfigjson</text>
  <text x="816" y="340" font-family="sans-serif" font-size="11" fill="#6a6e73">镜像仓库认证</text>

  <text x="816" y="368" font-family="monospace" font-size="12" fill="#151515">kubernetes.io/basic-auth</text>
  <text x="816" y="386" font-family="sans-serif" font-size="11" fill="#6a6e73">用户名与密码</text>

  <!-- Usage card -->
  <rect x="792" y="448" width="360" height="296" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="816" y="482" font-family="sans-serif" font-size="15" font-weight="700" fill="#151515">引用方式</text>

  <circle cx="822" cy="510" r="4" fill="#0066cc"/>
  <text x="836" y="514" font-family="sans-serif" font-size="12" font-weight="700" fill="#151515">环境变量</text>
  <text x="836" y="532" font-family="sans-serif" font-size="11" fill="#6a6e73">secretKeyRef 注入容器</text>

  <circle cx="822" cy="558" r="4" fill="#0066cc"/>
  <text x="836" y="562" font-family="sans-serif" font-size="12" font-weight="700" fill="#151515">文件挂载</text>
  <text x="836" y="580" font-family="sans-serif" font-size="11" fill="#6a6e73">挂载到容器指定路径</text>

  <circle cx="822" cy="606" r="4" fill="#0066cc"/>
  <text x="836" y="610" font-family="sans-serif" font-size="12" font-weight="700" fill="#151515">镜像拉取密钥</text>
  <text x="836" y="628" font-family="sans-serif" font-size="11" fill="#6a6e73">imagePullSecrets 引用</text>

  <rect x="816" y="650" width="312" height="76" rx="4" fill="#fdf3e3" stroke="#c58c00"/>
  <text x="830" y="672" font-family="sans-serif" font-size="11" fill="#7a5200">Secret 仅做 base64 编码，不是加密。</text>
  <text x="830" y="692" font-family="sans-serif" font-size="11" fill="#7a5200">更新后环境变量需重启容器组生效，</text>
  <text x="830" y="712" font-family="sans-serif" font-size="11" fill="#7a5200">挂载文件由 kubelet 定期同步。</text>

  <text x="48" y="776" font-family="sans-serif" font-size="11" fill="#8a8d90">示意图，仅用于说明页面结构与操作区域，不代表实际界面像素。</text>
</svg>
