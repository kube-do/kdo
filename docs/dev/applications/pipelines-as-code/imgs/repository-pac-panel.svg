<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Pipelines as Code 配置面板示意图</title>
  <desc id="desc">左侧为 Repository 自定义资源字段，右上为事件匹配注解，右下为最近 PipelineRun 状态列表。</desc>

  <rect width="1200" height="820" fill="#f3f4f6"/>

  <!-- Masthead -->
  <rect width="1200" height="56" fill="#151515"/>
  <text x="48" y="35" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">KDO 控制台</text>
  <text x="960" y="35" font-family="sans-serif" font-size="12" fill="#9aa0a6">应用管理 / Pipelines as Code</text>

  <!-- Heading -->
  <text x="48" y="110" font-family="sans-serif" font-size="28" font-weight="700" fill="#151515">Pipelines as Code 配置面板</text>
  <text x="48" y="136" font-family="sans-serif" font-size="14" fill="#6a6e73">Repository 自定义资源、事件匹配注解与 PipelineRun 状态。</text>

  <!-- Repository card -->
  <rect x="48" y="164" width="420" height="600" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="72" y="198" font-family="sans-serif" font-size="17" font-weight="700" fill="#151515">Repository</text>
  <text x="72" y="220" font-family="sans-serif" font-size="12" fill="#6a6e73">控制器在 Repository 所在命名空间创建运行。</text>

  <text x="72" y="252" font-family="sans-serif" font-size="12" fill="#6a6e73">名称</text>
  <rect x="72" y="260" width="160" height="32" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="84" y="281" font-family="sans-serif" font-size="12" fill="#151515">my-repo</text>

  <text x="252" y="252" font-family="sans-serif" font-size="12" fill="#6a6e73">命名空间</text>
  <rect x="252" y="260" width="192" height="32" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="264" y="281" font-family="sans-serif" font-size="12" fill="#151515">ci</text>

  <text x="72" y="320" font-family="sans-serif" font-size="12" fill="#6a6e73">仓库 URL</text>
  <rect x="72" y="328" width="372" height="32" rx="4" fill="#ffffff" stroke="#0066cc" stroke-width="2"/>
  <text x="84" y="349" font-family="monospace" font-size="11" fill="#151515">https://github.com/owner/repo</text>

  <text x="72" y="388" font-family="sans-serif" font-size="12" fill="#6a6e73">Git 提供商</text>
  <rect x="72" y="396" width="372" height="32" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="84" y="417" font-family="sans-serif" font-size="12" fill="#151515">github</text>
  <text x="420" y="417" font-family="sans-serif" font-size="12" fill="#6a6e73">▾</text>

  <text x="72" y="456" font-family="sans-serif" font-size="12" fill="#6a6e73">访问 Secret</text>
  <rect x="72" y="464" width="372" height="32" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="84" y="485" font-family="sans-serif" font-size="12" fill="#151515">owner-token</text>

  <text x="72" y="524" font-family="sans-serif" font-size="12" fill="#6a6e73">Webhook Secret</text>
  <rect x="72" y="532" width="372" height="32" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="84" y="553" font-family="sans-serif" font-size="12" fill="#151515">repo-webhook-secret</text>

  <text x="72" y="592" font-family="sans-serif" font-size="12" fill="#6a6e73">pipelinerun_provenance</text>
  <rect x="72" y="600" width="372" height="32" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="84" y="621" font-family="sans-serif" font-size="12" fill="#151515">default_branch</text>
  <text x="420" y="621" font-family="sans-serif" font-size="12" fill="#6a6e73">▾</text>

  <line x1="72" y1="660" x2="444" y2="660" stroke="#e0e0e0"/>
  <text x="72" y="686" font-family="sans-serif" font-size="12" font-weight="700" fill="#151515">安全说明</text>
  <text x="72" y="708" font-family="sans-serif" font-size="11" fill="#6a6e73">设为 default_branch 时，只使用默认分支中的</text>
  <text x="72" y="726" font-family="sans-serif" font-size="11" fill="#6a6e73">.tekton 定义，要求变更先经过合并审查。</text>

  <!-- Annotations card -->
  <rect x="492" y="164" width="660" height="280" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="516" y="198" font-family="sans-serif" font-size="15" font-weight="700" fill="#151515">事件匹配注解</text>
  <text x="516" y="218" font-family="sans-serif" font-size="11" fill="#6a6e73">写在 .tekton 目录的 PipelineRun 定义中</text>

  <rect x="516" y="232" width="612" height="170" rx="4" fill="#f3f4f6"/>
  <text x="530" y="256" font-family="monospace" font-size="11" fill="#151515">pipelinesascode.tekton.dev/on-event: "[pull_request]"</text>
  <text x="530" y="280" font-family="monospace" font-size="11" fill="#151515">pipelinesascode.tekton.dev/on-target-branch: "[main]"</text>
  <text x="530" y="304" font-family="monospace" font-size="11" fill="#151515">pipelinesascode.tekton.dev/on-path-changed: "[src/**, Dockerfile]"</text>
  <text x="530" y="328" font-family="monospace" font-size="11" fill="#151515">pipelinesascode.tekton.dev/on-label: "[bug, defect]"</text>
  <text x="530" y="352" font-family="monospace" font-size="11" fill="#151515">pipelinesascode.tekton.dev/cancel-in-progress: "true"</text>
  <text x="530" y="376" font-family="monospace" font-size="11" fill="#151515">pipelinesascode.tekton.dev/max-keep-runs: "5"</text>

  <text x="516" y="426" font-family="sans-serif" font-size="11" fill="#6a6e73">只有注解与 Git 事件同时匹配时，控制器才会创建 PipelineRun。</text>

  <!-- PipelineRun card -->
  <rect x="492" y="468" width="660" height="296" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="516" y="500" font-family="sans-serif" font-size="15" font-weight="700" fill="#151515">最近 PipelineRun</text>
  <text x="1080" y="500" font-family="sans-serif" font-size="11" fill="#6a6e73">仓库默认分支</text>

  <text x="516" y="532" font-family="sans-serif" font-size="11" fill="#6a6e73">名称</text>
  <text x="800" y="532" font-family="sans-serif" font-size="11" fill="#6a6e73">事件</text>
  <text x="920" y="532" font-family="sans-serif" font-size="11" fill="#6a6e73">开始时间</text>
  <text x="1040" y="532" font-family="sans-serif" font-size="11" fill="#6a6e73">状态</text>

  <line x1="516" y1="542" x2="1128" y2="542" stroke="#e0e0e0"/>

  <text x="516" y="570" font-family="monospace" font-size="12" fill="#151515">pipeline-main-build</text>
  <text x="800" y="570" font-family="sans-serif" font-size="11" fill="#6a6e73">push</text>
  <text x="920" y="570" font-family="sans-serif" font-size="11" fill="#6a6e73">10:24</text>
  <rect x="1040" y="556" width="72" height="20" rx="10" fill="#e7f5ec"/>
  <text x="1052" y="570" font-family="sans-serif" font-size="11" fill="#1e4f18">Succeeded</text>

  <line x1="516" y1="584" x2="1128" y2="584" stroke="#e0e0e0"/>

  <text x="516" y="612" font-family="monospace" font-size="12" fill="#151515">pipeline-pr-check</text>
  <text x="800" y="612" font-family="sans-serif" font-size="11" fill="#6a6e73">pull_request</text>
  <text x="920" y="612" font-family="sans-serif" font-size="11" fill="#6a6e73">10:31</text>
  <rect x="1040" y="598" width="58" height="20" rx="10" fill="#fdf3e3"/>
  <text x="1052" y="612" font-family="sans-serif" font-size="11" fill="#7a5200">Running</text>

  <line x1="516" y1="626" x2="1128" y2="626" stroke="#e0e0e0"/>

  <text x="516" y="654" font-family="monospace" font-size="12" fill="#151515">pipeline-nightly</text>
  <text x="800" y="654" font-family="sans-serif" font-size="11" fill="#6a6e73">schedule</text>
  <text x="920" y="654" font-family="sans-serif" font-size="11" fill="#6a6e73">02:00</text>
  <rect x="1040" y="640" width="54" height="20" rx="10" fill="#faeae8"/>
  <text x="1052" y="654" font-family="sans-serif" font-size="11" fill="#8a1207">Failed</text>

  <line x1="516" y1="668" x2="1128" y2="668" stroke="#e0e0e0"/>

  <text x="516" y="696" font-family="sans-serif" font-size="11" fill="#6a6e73">运行状态会通过 Checks API 或 PR 评论回报到 Git 提供商。</text>
  <text x="516" y="720" font-family="sans-serif" font-size="11" fill="#6a6e73">可在 Repository 详情中查看最近 5 条状态消息。</text>

  <text x="48" y="796" font-family="sans-serif" font-size="11" fill="#8a8d90">示意图，仅用于说明页面结构与操作区域，不代表实际界面像素。</text>
</svg>
