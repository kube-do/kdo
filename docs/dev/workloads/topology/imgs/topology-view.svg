<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">组件拓扑页面示意图</title>
  <desc id="desc">顶部为搜索、布局、过滤与导出工具栏，中间为 Ingress、Service、Deployment、StatefulSet 与 Pod 组成的拓扑画布，右侧为选中节点详情。</desc>

  <rect width="1200" height="820" fill="#f3f4f6"/>

  <!-- Masthead -->
  <rect width="1200" height="56" fill="#151515"/>
  <text x="48" y="35" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">KDO 控制台</text>
  <text x="1000" y="35" font-family="sans-serif" font-size="12" fill="#9aa0a6">工作负载 / 组件拓扑</text>

  <!-- Heading -->
  <text x="48" y="104" font-family="sans-serif" font-size="28" font-weight="700" fill="#151515">组件拓扑</text>
  <text x="48" y="128" font-family="sans-serif" font-size="14" fill="#6a6e73">展示路由、服务与工作负载之间的依赖，并按健康状态着色。</text>

  <!-- Toolbar -->
  <rect x="48" y="150" width="1104" height="48" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <rect x="68" y="160" width="260" height="28" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="82" y="179" font-family="sans-serif" font-size="12" fill="#9aa0a6">搜索资源名称</text>

  <rect x="348" y="160" width="150" height="28" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="362" y="179" font-family="sans-serif" font-size="12" fill="#151515">布局：分层</text>
  <text x="476" y="179" font-family="sans-serif" font-size="11" fill="#6a6e73">▾</text>

  <rect x="518" y="160" width="180" height="28" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="532" y="179" font-family="sans-serif" font-size="12" fill="#151515">过滤：app=myapp</text>

  <text x="730" y="179" font-family="sans-serif" font-size="11" fill="#3e8635">● 自动刷新 30s</text>

  <rect x="1032" y="160" width="64" height="28" rx="4" fill="#ffffff" stroke="#0066cc"/>
  <text x="1053" y="179" font-family="sans-serif" font-size="12" fill="#0066cc">导出</text>

  <!-- Canvas -->
  <rect x="48" y="216" width="800" height="520" rx="6" fill="#ffffff" stroke="#e0e0e0"/>

  <!-- Ingress node -->
  <rect x="330" y="248" width="220" height="48" rx="6" fill="#fdf3e3" stroke="#c58c00"/>
  <text x="440" y="268" font-family="sans-serif" font-size="13" font-weight="700" fill="#151515" text-anchor="middle">Ingress</text>
  <text x="440" y="286" font-family="sans-serif" font-size="11" fill="#6a6e73" text-anchor="middle">myapp.example.com</text>

  <!-- Service node -->
  <rect x="330" y="340" width="220" height="48" rx="6" fill="#e7f1fa" stroke="#0066cc"/>
  <text x="440" y="360" font-family="sans-serif" font-size="13" font-weight="700" fill="#151515" text-anchor="middle">Service</text>
  <text x="440" y="378" font-family="sans-serif" font-size="11" fill="#6a6e73" text-anchor="middle">myapp-svc · 80</text>

  <!-- Deployment node -->
  <rect x="180" y="440" width="190" height="56" rx="6" fill="#e7f5ec" stroke="#3e8635"/>
  <text x="275" y="464" font-family="sans-serif" font-size="13" font-weight="700" fill="#151515" text-anchor="middle">Deployment</text>
  <text x="275" y="482" font-family="sans-serif" font-size="11" fill="#6a6e73" text-anchor="middle">myapp · 2/2</text>

  <!-- StatefulSet node -->
  <rect x="560" y="440" width="190" height="56" rx="6" fill="#e7f5ec" stroke="#3e8635"/>
  <text x="655" y="464" font-family="sans-serif" font-size="13" font-weight="700" fill="#151515" text-anchor="middle">StatefulSet</text>
  <text x="655" y="482" font-family="sans-serif" font-size="11" fill="#6a6e73" text-anchor="middle">cache · 2/2</text>

  <!-- Links -->
  <line x1="440" y1="296" x2="440" y2="340" stroke="#8a8d90" stroke-width="1.5"/>
  <polyline points="440,388 440,414 275,414 275,440" fill="none" stroke="#8a8d90" stroke-width="1.5"/>
  <polyline points="440,388 440,414 655,414 655,440" fill="none" stroke="#8a8d90" stroke-width="1.5"/>

  <!-- Pods -->
  <text x="72" y="540" font-family="sans-serif" font-size="11" fill="#6a6e73">容器组</text>

  <rect x="140" y="552" width="110" height="42" rx="6" fill="#ffffff" stroke="#3e8635"/>
  <circle cx="154" cy="566" r="4" fill="#3e8635"/>
  <text x="166" y="570" font-family="sans-serif" font-size="11" fill="#151515">web-1</text>
  <text x="154" y="586" font-family="sans-serif" font-size="10" fill="#6a6e73">Running</text>

  <rect x="270" y="552" width="110" height="42" rx="6" fill="#ffffff" stroke="#3e8635"/>
  <circle cx="284" cy="566" r="4" fill="#3e8635"/>
  <text x="296" y="570" font-family="sans-serif" font-size="11" fill="#151515">web-2</text>
  <text x="284" y="586" font-family="sans-serif" font-size="10" fill="#6a6e73">Running</text>

  <rect x="440" y="552" width="110" height="42" rx="6" fill="#ffffff" stroke="#3e8635"/>
  <circle cx="454" cy="566" r="4" fill="#3e8635"/>
  <text x="466" y="570" font-family="sans-serif" font-size="11" fill="#151515">cache-0</text>
  <text x="454" y="586" font-family="sans-serif" font-size="10" fill="#6a6e73">Running</text>

  <rect x="570" y="552" width="110" height="42" rx="6" fill="#ffffff" stroke="#c58c00"/>
  <circle cx="584" cy="566" r="4" fill="#c58c00"/>
  <text x="596" y="570" font-family="sans-serif" font-size="11" fill="#151515">cache-1</text>
  <text x="584" y="586" font-family="sans-serif" font-size="10" fill="#6a6e73">Pending</text>

  <polyline points="275,496 275,524 195,524 195,552" fill="none" stroke="#8a8d90" stroke-width="1.5"/>
  <polyline points="275,496 275,524 325,524 325,552" fill="none" stroke="#8a8d90" stroke-width="1.5"/>
  <polyline points="655,496 655,524 495,524 495,552" fill="none" stroke="#8a8d90" stroke-width="1.5"/>
  <polyline points="655,496 655,524 625,524 625,552" fill="none" stroke="#8a8d90" stroke-width="1.5"/>

  <!-- Legend -->
  <line x1="72" y1="636" x2="824" y2="636" stroke="#e0e0e0"/>
  <circle cx="80" cy="664" r="5" fill="#3e8635"/>
  <text x="92" y="668" font-family="sans-serif" font-size="11" fill="#6a6e73">健康</text>
  <circle cx="160" cy="664" r="5" fill="#c58c00"/>
  <text x="172" y="668" font-family="sans-serif" font-size="11" fill="#6a6e73">警告</text>
  <circle cx="240" cy="664" r="5" fill="#c9190b"/>
  <text x="252" y="668" font-family="sans-serif" font-size="11" fill="#6a6e73">异常</text>
  <text x="340" y="668" font-family="sans-serif" font-size="11" fill="#6a6e73">连线表示依赖方向，默认按命名空间分组。</text>
  <text x="72" y="700" font-family="sans-serif" font-size="11" fill="#6a6e73">拖拽画布移动，滚轮缩放，双击节点跳转资源详情。</text>

  <!-- Detail panel -->
  <rect x="872" y="216" width="280" height="520" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="896" y="250" font-family="sans-serif" font-size="15" font-weight="700" fill="#151515">节点详情</text>

  <text x="896" y="282" font-family="sans-serif" font-size="13" font-weight="700" fill="#004080">Service · myapp-svc</text>

  <text x="896" y="312" font-family="sans-serif" font-size="11" fill="#6a6e73">类型</text>
  <text x="1010" y="312" font-family="sans-serif" font-size="11" fill="#151515">ClusterIP</text>

  <text x="896" y="338" font-family="sans-serif" font-size="11" fill="#6a6e73">端口</text>
  <text x="1010" y="338" font-family="sans-serif" font-size="11" fill="#151515">80 → 8080</text>

  <text x="896" y="364" font-family="sans-serif" font-size="11" fill="#6a6e73">关联容器组</text>
  <text x="1010" y="364" font-family="sans-serif" font-size="11" fill="#151515">2</text>

  <text x="896" y="390" font-family="sans-serif" font-size="11" fill="#6a6e73">健康</text>
  <text x="1010" y="390" font-family="sans-serif" font-size="11" fill="#3e8635">正常</text>

  <line x1="896" y1="414" x2="1128" y2="414" stroke="#e0e0e0"/>

  <text x="896" y="442" font-family="sans-serif" font-size="12" font-weight="700" fill="#151515">入站依赖</text>
  <text x="896" y="464" font-family="sans-serif" font-size="11" fill="#6a6e73">myapp-ingress</text>

  <text x="896" y="494" font-family="sans-serif" font-size="12" font-weight="700" fill="#151515">出站依赖</text>
  <text x="896" y="516" font-family="sans-serif" font-size="11" fill="#6a6e73">Deployment · myapp</text>
  <text x="896" y="536" font-family="sans-serif" font-size="11" fill="#6a6e73">StatefulSet · cache</text>

  <rect x="896" y="572" width="104" height="30" rx="4" fill="#0066cc"/>
  <text x="916" y="592" font-family="sans-serif" font-size="12" fill="#ffffff">查看详情</text>
  <rect x="1012" y="572" width="104" height="30" rx="4" fill="#ffffff" stroke="#0066cc"/>
  <text x="1038" y="592" font-family="sans-serif" font-size="12" fill="#0066cc">隐藏节点</text>

  <line x1="896" y1="622" x2="1128" y2="622" stroke="#e0e0e0"/>
  <text x="896" y="650" font-family="sans-serif" font-size="11" fill="#6a6e73">点击节点会高亮入站与出站依赖，</text>
  <text x="896" y="670" font-family="sans-serif" font-size="11" fill="#6a6e73">其余节点变灰。</text>
  <text x="896" y="700" font-family="sans-serif" font-size="11" fill="#6a6e73">拓扑每 30 秒自动刷新。</text>

  <text x="48" y="796" font-family="sans-serif" font-size="11" fill="#8a8d90">示意图，仅用于说明页面结构与操作区域，不代表实际界面像素。</text>
</svg>
