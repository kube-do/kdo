<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">副本集列表与详情示意图</title>
  <desc id="desc">页面上方提示副本集由 Deployment 创建，中间为副本集列表，下方为选中副本集的 Pod、YAML 与事件标签页。</desc>

  <rect width="1200" height="780" fill="#f3f4f6"/>

  <!-- Masthead -->
  <rect width="1200" height="56" fill="#151515"/>
  <text x="48" y="35" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">KDO Console</text>
  <text x="190" y="35" font-family="sans-serif" font-size="13" fill="#9aa0a6">管理员界面 / 工作负载 / 副本集</text>
  <circle cx="1104" cy="28" r="10" fill="#3c3f44"/>
  <circle cx="1146" cy="28" r="10" fill="#3c3f44"/>

  <!-- Heading -->
  <text x="48" y="106" font-family="sans-serif" font-size="28" font-weight="700" fill="#151515">副本集</text>
  <text x="48" y="134" font-family="sans-serif" font-size="14" fill="#6a6e73">查看 Deployment 创建的副本集及其管理的 Pod。</text>

  <!-- Info banner -->
  <rect x="48" y="154" width="1104" height="46" rx="4" fill="#e7f1fa" stroke="#0066cc"/>
  <text x="64" y="175" font-family="sans-serif" font-size="12" fill="#004080">副本集通常由 Deployment 自动创建，KDO 暂不提供创建入口。</text>
  <text x="64" y="191" font-family="sans-serif" font-size="11" fill="#004080">如需维护副本数，请在上层 Deployment 中调整，由 Deployment 生成新的副本集。</text>

