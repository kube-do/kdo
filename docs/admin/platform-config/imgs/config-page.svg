<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">平台配置编辑器示意图</title>
  <desc id="desc">页面左侧为配置分区导航，右侧为表单字段、变更预览和保存/重启操作。</desc>

  <rect width="1200" height="760" fill="#f3f4f6"/>

  <!-- Heading -->
  <text x="48" y="80" font-family="sans-serif" font-size="28" font-weight="700" fill="#151515">Platform configuration</text>
  <text x="48" y="108" font-family="sans-serif" font-size="14" fill="#6a6e73">Manage Console and KDC settings with validation, preview, and restart status.</text>

  <!-- Mode switch -->
  <rect x="48" y="128" width="76" height="32" rx="4" fill="#0066cc"/>
  <text x="72" y="149" font-family="sans-serif" font-size="13" fill="#ffffff">Form</text>
  <rect x="124" y="128" width="76" height="32" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="148" y="149" font-family="sans-serif" font-size="13" fill="#151515">YAML</text>
  <rect x="952" y="128" width="200" height="32" rx="4" fill="#e7f1fa" stroke="#0066cc"/>
  <text x="968" y="149" font-family="sans-serif" font-size="12" fill="#004080">kubedo-system/console · admin</text>

  <!-- Left navigation -->
  <rect x="48" y="184" width="262" height="504" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="68" y="214" font-family="sans-serif" font-size="12" font-weight="700" fill="#6a6e73">SECTIONS</text>
  <rect x="56" y="228" width="246" height="36" rx="4" fill="#e7f1fa"/>
  <text x="70" y="251" font-family="sans-serif" font-size="13" font-weight="700" fill="#004080">Basic settings</text>
  <text x="70" y="291" font-family="sans-serif" font-size="13" fill="#151515">Authentication</text>
  <text x="70" y="327" font-family="sans-serif" font-size="13" fill="#151515">Image registry</text>
  <text x="70" y="363" font-family="sans-serif" font-size="13" fill="#151515">Monitoring &amp; certificates</text>
  <text x="70" y="399" font-family="sans-serif" font-size="13" fill="#151515">Interface customization</text>
  <text x="70" y="435" font-family="sans-serif" font-size="13" fill="#151515">Extensions &amp; proxies</text>
  <text x="70" y="471" font-family="sans-serif" font-size="13" fill="#151515">Advanced YAML</text>

  <text x="68" y="528" font-family="sans-serif" font-size="12" font-weight="700" fill="#6a6e73">STATUS</text>
  <rect x="68" y="540" width="10" height="10" rx="5" fill="#3e8635"/>
  <text x="86" y="550" font-family="sans-serif" font-size="12" fill="#151515">Synced</text>
  <text x="68" y="574" font-family="sans-serif" font-size="11" fill="#6a6e73">Console: running</text>
  <text x="68" y="592" font-family="sans-serif" font-size="11" fill="#6a6e73">KDC: running</text>

  <!-- Form card -->
  <rect x="330" y="184" width="822" height="286" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="352" y="216" font-family="sans-serif" font-size="17" font-weight="700" fill="#151515">Basic settings</text>
  <text x="352" y="238" font-family="sans-serif" font-size="12" fill="#6a6e73">Console access, cluster information, serving and runtime options.</text>

  <text x="352" y="272" font-family="sans-serif" font-size="12" fill="#6a6e73">Console URL</text>
  <rect x="352" y="280" width="360" height="34" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="366" y="302" font-family="sans-serif" font-size="13" fill="#151515">https://console.example.com</text>

  <text x="740" y="272" font-family="sans-serif" font-size="12" fill="#6a6e73">Cluster name</text>
  <rect x="740" y="280" width="240" height="34" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="754" y="302" font-family="sans-serif" font-size="13" fill="#151515">kdo</text>

  <text x="352" y="348" font-family="sans-serif" font-size="12" fill="#6a6e73">Base path</text>
  <rect x="352" y="356" width="200" height="34" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="366" y="378" font-family="sans-serif" font-size="13" fill="#151515">/</text>

  <text x="586" y="348" font-family="sans-serif" font-size="12" fill="#6a6e73">Log level</text>
  <rect x="586" y="356" width="160" height="34" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="600" y="378" font-family="sans-serif" font-size="13" fill="#151515">info</text>

  <text x="352" y="424" font-family="sans-serif" font-size="12" fill="#6a6e73">TLS</text>
  <rect x="352" y="432" width="36" height="20" rx="10" fill="#0066cc"/>
  <circle cx="370" cy="442" r="8" fill="#ffffff"/>
  <text x="398" y="447" font-family="sans-serif" font-size="12" fill="#151515">Enabled</text>

  <!-- Preview card -->
  <rect x="330" y="486" width="822" height="202" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="352" y="518" font-family="sans-serif" font-size="15" font-weight="700" fill="#151515">Change preview</text>
  <rect x="352" y="530" width="778" height="26" rx="3" fill="#faeae8"/>
  <text x="362" y="548" font-family="monospace" font-size="12" fill="#8a1207">- auth.oidcProvider: keycloak</text>
  <rect x="352" y="560" width="778" height="26" rx="3" fill="#e7f5ec"/>
  <text x="362" y="578" font-family="monospace" font-size="12" fill="#1e4f18">+ auth.oidcProvider: casdoor</text>

  <text x="352" y="612" font-family="sans-serif" font-size="12" fill="#3e8635">✓ Validation passed (0 errors, 1 warning)</text>
  <text x="352" y="634" font-family="sans-serif" font-size="12" fill="#7a5200">! Restarting Console is required for authentication changes.</text>

  <rect x="352" y="650" width="82" height="30" rx="4" fill="#0066cc"/>
  <text x="374" y="670" font-family="sans-serif" font-size="12" fill="#ffffff">Save</text>
  <rect x="444" y="650" width="128" height="30" rx="4" fill="#ffffff" stroke="#0066cc"/>
  <text x="462" y="670" font-family="sans-serif" font-size="12" fill="#0066cc">Restart Console</text>
  <rect x="582" y="650" width="108" height="30" rx="4" fill="#ffffff" stroke="#0066cc"/>
  <text x="602" y="670" font-family="sans-serif" font-size="12" fill="#0066cc">Restart KDC</text>

  <!-- Footer hint -->
  <text x="48" y="722" font-family="sans-serif" font-size="11" fill="#8a8d90">示意图，仅用于说明页面结构与操作区域，不代表实际界面像素。</text>
</svg>
