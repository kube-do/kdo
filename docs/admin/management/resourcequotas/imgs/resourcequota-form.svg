<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">创建资源配额表单示意图</title>
  <desc id="desc">左侧表单按计算资源、存储资源和对象数量分组填写上限，右侧为配额估算与已用比例预览。</desc>

  <rect width="1200" height="840" fill="#f3f4f6"/>

  <!-- Masthead -->
  <rect width="1200" height="56" fill="#151515"/>
  <text x="48" y="35" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">KDO Console</text>
  <text x="190" y="35" font-family="sans-serif" font-size="13" fill="#9aa0a6">管理员界面 / 管理 / 资源配额</text>
  <circle cx="1104" cy="28" r="10" fill="#3c3f44"/>
  <circle cx="1146" cy="28" r="10" fill="#3c3f44"/>

  <!-- Heading -->
  <text x="48" y="106" font-family="sans-serif" font-size="28" font-weight="700" fill="#151515">创建资源配额</text>
  <text x="48" y="134" font-family="sans-serif" font-size="14" fill="#6a6e73">限制单个命名空间的资源总量与对象数量。</text>

  <!-- Form -->
  <rect x="48" y="160" width="760" height="620" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="72" y="192" font-family="sans-serif" font-size="17" font-weight="700" fill="#151515">基本信息</text>

  <text x="72" y="222" font-family="sans-serif" font-size="12" fill="#6a6e73">名称</text>
  <rect x="72" y="230" width="300" height="34" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="86" y="252" font-family="sans-serif" font-size="13" fill="#151515">dev-quota</text>

  <text x="396" y="222" font-family="sans-serif" font-size="12" fill="#6a6e73">命名空间</text>
  <rect x="396" y="230" width="300" height="34" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="410" y="252" font-family="sans-serif" font-size="13" fill="#151515">development</text>
  <text x="666" y="252" font-family="sans-serif" font-size="12" fill="#6a6e73">▾</text>

  <line x1="72" y1="282" x2="784" y2="282" stroke="#e0e0e0"/>

  <text x="72" y="310" font-family="sans-serif" font-size="14" font-weight="700" fill="#151515">计算资源</text>

  <text x="72" y="336" font-family="sans-serif" font-size="12" fill="#6a6e73">requests.cpu</text>
  <rect x="72" y="344" width="300" height="34" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="86" y="366" font-family="sans-serif" font-size="13" fill="#151515">4</text>

  <text x="396" y="336" font-family="sans-serif" font-size="12" fill="#6a6e73">requests.memory</text>
  <rect x="396" y="344" width="300" height="34" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="410" y="366" font-family="sans-serif" font-size="13" fill="#151515">8Gi</text>

  <text x="72" y="402" font-family="sans-serif" font-size="12" fill="#6a6e73">limits.cpu</text>
  <rect x="72" y="410" width="300" height="34" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="86" y="432" font-family="sans-serif" font-size="13" fill="#151515">8</text>

  <text x="396" y="402" font-family="sans-serif" font-size="12" fill="#6a6e73">limits.memory</text>
  <rect x="396" y="410" width="300" height="34" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="410" y="432" font-family="sans-serif" font-size="13" fill="#151515">16Gi</text>

  <line x1="72" y1="466" x2="784" y2="466" stroke="#e0e0e0"/>

  <text x="72" y="494" font-family="sans-serif" font-size="14" font-weight="700" fill="#151515">存储资源</text>

  <text x="72" y="520" font-family="sans-serif" font-size="12" fill="#6a6e73">requests.storage</text>
  <rect x="72" y="528" width="300" height="34" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="86" y="550" font-family="sans-serif" font-size="13" fill="#151515">50Gi</text>

  <text x="396" y="520" font-family="sans-serif" font-size="12" fill="#6a6e73">persistentvolumeclaims</text>
  <rect x="396" y="528" width="300" height="34" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="410" y="550" font-family="sans-serif" font-size="13" fill="#151515">10</text>

  <line x1="72" y1="584" x2="784" y2="584" stroke="#e0e0e0"/>

  <text x="72" y="612" font-family="sans-serif" font-size="14" font-weight="700" fill="#151515">对象数量</text>

  <text x="72" y="638" font-family="sans-serif" font-size="12" fill="#6a6e73">pods</text>
  <rect x="72" y="646" width="300" height="34" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="86" y="668" font-family="sans-serif" font-size="13" fill="#151515">20</text>

  <text x="396" y="638" font-family="sans-serif" font-size="12" fill="#6a6e73">services</text>
  <rect x="396" y="646" width="300" height="34" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="410" y="668" font-family="sans-serif" font-size="13" fill="#151515">10</text>

  <text x="72" y="704" font-family="sans-serif" font-size="12" fill="#6a6e73">configmaps</text>
  <rect x="72" y="712" width="300" height="34" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="86" y="734" font-family="sans-serif" font-size="13" fill="#151515">20</text>

  <text x="396" y="704" font-family="sans-serif" font-size="12" fill="#6a6e73">secrets</text>
  <rect x="396" y="712" width="300" height="34" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="410" y="734" font-family="sans-serif" font-size="13" fill="#151515">30</text>

  <!-- Preview -->
  <rect x="832" y="160" width="320" height="620" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="856" y="192" font-family="sans-serif" font-size="17" font-weight="700" fill="#151515">配额估算</text>
  <text x="856" y="212" font-family="sans-serif" font-size="12" fill="#6a6e73">按当前命名空间已用量预览。</text>

  <text x="856" y="248" font-family="sans-serif" font-size="12" fill="#151515">CPU</text>
  <text x="1128" y="248" text-anchor="end" font-family="sans-serif" font-size="12" fill="#6a6e73">2 / 4 核</text>
  <rect x="856" y="258" width="240" height="8" rx="4" fill="#e0e0e0"/>
  <rect x="856" y="258" width="120" height="8" rx="4" fill="#0066cc"/>

  <text x="856" y="304" font-family="sans-serif" font-size="12" fill="#151515">内存</text>
  <text x="1128" y="304" text-anchor="end" font-family="sans-serif" font-size="12" fill="#6a6e73">6 / 8 GiB</text>
  <rect x="856" y="314" width="240" height="8" rx="4" fill="#e0e0e0"/>
  <rect x="856" y="314" width="180" height="8" rx="4" fill="#c58c00"/>

  <text x="856" y="360" font-family="sans-serif" font-size="12" fill="#151515">Pod</text>
  <text x="1128" y="360" text-anchor="end" font-family="sans-serif" font-size="12" fill="#6a6e73">12 / 20</text>
  <rect x="856" y="370" width="240" height="8" rx="4" fill="#e0e0e0"/>
  <rect x="856" y="370" width="144" height="8" rx="4" fill="#0066cc"/>

  <text x="856" y="416" font-family="sans-serif" font-size="12" fill="#151515">PVC</text>
  <text x="1128" y="416" text-anchor="end" font-family="sans-serif" font-size="12" fill="#6a6e73">8 / 10</text>
  <rect x="856" y="426" width="240" height="8" rx="4" fill="#e0e0e0"/>
  <rect x="856" y="426" width="192" height="8" rx="4" fill="#c9190b"/>

  <text x="856" y="472" font-family="sans-serif" font-size="12" fill="#151515">Service</text>
  <text x="1128" y="472" text-anchor="end" font-family="sans-serif" font-size="12" fill="#6a6e73">3 / 10</text>
  <rect x="856" y="482" width="240" height="8" rx="4" fill="#e0e0e0"/>
  <rect x="856" y="482" width="72" height="8" rx="4" fill="#0066cc"/>

  <text x="856" y="528" font-family="sans-serif" font-size="12" fill="#151515">Secret</text>
  <text x="1128" y="528" text-anchor="end" font-family="sans-serif" font-size="12" fill="#6a6e73">18 / 30</text>
  <rect x="856" y="538" width="240" height="8" rx="4" fill="#e0e0e0"/>
  <rect x="856" y="538" width="144" height="8" rx="4" fill="#0066cc"/>

  <text x="856" y="584" font-family="sans-serif" font-size="12" fill="#151515">ConfigMap</text>
  <text x="1128" y="584" text-anchor="end" font-family="sans-serif" font-size="12" fill="#6a6e73">9 / 20</text>
  <rect x="856" y="594" width="240" height="8" rx="4" fill="#e0e0e0"/>
  <rect x="856" y="594" width="108" height="8" rx="4" fill="#0066cc"/>

  <rect x="856" y="632" width="272" height="44" rx="4" fill="#fdf3e3" stroke="#f0ab00"/>
  <text x="868" y="650" font-family="sans-serif" font-size="11" fill="#7a5200">PVC 已用 8/10，接近配额上限。</text>
  <text x="868" y="666" font-family="sans-serif" font-size="11" fill="#7a5200">提交前请确认上限满足后续增长。</text>

  <text x="856" y="704" font-family="sans-serif" font-size="11" fill="#6a6e73">配额只作用于命名空间级别，</text>
  <text x="856" y="722" font-family="sans-serif" font-size="11" fill="#6a6e73">修改后仅影响新创建的资源。</text>

  <rect x="856" y="740" width="80" height="30" rx="4" fill="#0066cc"/>
  <text x="880" y="760" font-family="sans-serif" font-size="12" fill="#ffffff">创建</text>
  <rect x="948" y="740" width="72" height="30" rx="4" fill="#ffffff" stroke="#0066cc"/>
  <text x="970" y="760" font-family="sans-serif" font-size="12" fill="#0066cc">取消</text>

  <text x="48" y="812" font-family="sans-serif" font-size="11" fill="#8a8d90">示意图，仅用于说明页面结构与操作区域，不代表实际界面像素。</text>
</svg>
