<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">已安装 Operators 列表页示意图</title>
  <desc id="desc">页面顶部为安装数量统计与筛选栏，中间为 Operator 列表，展示名称、命名空间、版本、CSV 状态、批准策略与操作。</desc>

  <rect width="1200" height="720" fill="#f3f4f6"/>

  <!-- Masthead -->
  <rect width="1200" height="56" fill="#151515"/>
  <text x="48" y="35" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">KDO Console</text>
  <text x="190" y="35" font-family="sans-serif" font-size="13" fill="#9aa0a6">管理员界面 / 应用管理 / 已安装 Operators</text>
  <circle cx="1104" cy="28" r="10" fill="#3c3f44"/>
  <circle cx="1146" cy="28" r="10" fill="#3c3f44"/>

  <!-- Heading -->
  <text x="48" y="106" font-family="sans-serif" font-size="28" font-weight="700" fill="#151515">已安装 Operators</text>
  <text x="48" y="134" font-family="sans-serif" font-size="14" fill="#6a6e73">查看 Operator 的 CSV 状态、批准策略与管理的自定义资源。</text>
  <rect x="948" y="86" width="204" height="36" rx="4" fill="#0066cc"/>
  <text x="984" y="109" font-family="sans-serif" font-size="14" fill="#ffffff">安装 Operator</text>

  <!-- Summary -->
  <rect x="48" y="160" width="220" height="62" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="68" y="186" font-family="sans-serif" font-size="12" fill="#6a6e73">已安装</text>
  <text x="68" y="210" font-family="sans-serif" font-size="20" font-weight="700" fill="#151515">12</text>

  <rect x="284" y="160" width="220" height="62" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="304" y="186" font-family="sans-serif" font-size="12" fill="#6a6e73">CSV 成功</text>
  <text x="304" y="210" font-family="sans-serif" font-size="20" font-weight="700" fill="#3e8635">10</text>

  <rect x="520" y="160" width="220" height="62" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="540" y="186" font-family="sans-serif" font-size="12" fill="#6a6e73">CSV 失败</text>
  <text x="540" y="210" font-family="sans-serif" font-size="20" font-weight="700" fill="#c9190b">2</text>

  <rect x="756" y="160" width="220" height="62" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="776" y="186" font-family="sans-serif" font-size="12" fill="#6a6e73">升级待批准</text>
  <text x="776" y="210" font-family="sans-serif" font-size="20" font-weight="700" fill="#c58c00">1</text>

  <!-- Filters -->
  <rect x="48" y="248" width="230" height="36" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="62" y="271" font-family="sans-serif" font-size="13" fill="#151515">命名空间：全部</text>
  <text x="252" y="271" font-family="sans-serif" font-size="12" fill="#6a6e73">▾</text>

  <rect x="294" y="248" width="240" height="36" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="308" y="271" font-family="sans-serif" font-size="13" fill="#151515">按名称搜索</text>

  <rect x="550" y="248" width="190" height="36" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="564" y="271" font-family="sans-serif" font-size="13" fill="#151515">状态：全部</text>
  <text x="712" y="271" font-family="sans-serif" font-size="12" fill="#6a6e73">▾</text>

  <!-- Table -->
  <rect x="48" y="308" width="1104" height="336" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <rect x="64" y="326" width="1072" height="34" fill="#f0f0f0"/>
  <text x="96" y="348" font-family="sans-serif" font-size="12" font-weight="700" fill="#6a6e73">名称</text>
  <text x="360" y="348" font-family="sans-serif" font-size="12" font-weight="700" fill="#6a6e73">命名空间</text>
  <text x="530" y="348" font-family="sans-serif" font-size="12" font-weight="700" fill="#6a6e73">版本</text>
  <text x="640" y="348" font-family="sans-serif" font-size="12" font-weight="700" fill="#6a6e73">CSV 状态</text>
  <text x="830" y="348" font-family="sans-serif" font-size="12" font-weight="700" fill="#6a6e73">批准策略</text>
  <text x="1050" y="348" font-family="sans-serif" font-size="12" font-weight="700" fill="#6a6e73">操作</text>

  <text x="96" y="404" font-family="sans-serif" font-size="14" font-weight="700" fill="#151515">postgres-operator</text>
  <text x="360" y="404" font-family="sans-serif" font-size="13" fill="#151515">operators</text>
  <text x="530" y="404" font-family="sans-serif" font-size="13" fill="#151515">v5.7.2</text>
  <rect x="640" y="386" width="96" height="24" rx="12" fill="#e7f5ec"/>
  <text x="656" y="402" font-family="sans-serif" font-size="12" fill="#1e4f18">Succeeded</text>
  <text x="830" y="404" font-family="sans-serif" font-size="13" fill="#151515">Automatic</text>
  <text x="1050" y="404" font-family="sans-serif" font-size="16" fill="#6a6e73">⋮</text>
  <line x1="64" y1="422" x2="1136" y2="422" stroke="#e0e0e0"/>

  <text x="96" y="468" font-family="sans-serif" font-size="14" font-weight="700" fill="#151515">redis-operator</text>
  <text x="360" y="468" font-family="sans-serif" font-size="13" fill="#151515">operators</text>
  <text x="530" y="468" font-family="sans-serif" font-size="13" fill="#151515">v3.2.0</text>
  <rect x="640" y="450" width="96" height="24" rx="12" fill="#e7f5ec"/>
  <text x="656" y="466" font-family="sans-serif" font-size="12" fill="#1e4f18">Succeeded</text>
  <text x="830" y="468" font-family="sans-serif" font-size="13" fill="#151515">Manual</text>
  <rect x="900" y="450" width="84" height="24" rx="12" fill="#fdf3e3"/>
  <text x="912" y="466" font-family="sans-serif" font-size="11" fill="#7a5200">待批准</text>
  <text x="1112" y="468" font-family="sans-serif" font-size="16" fill="#6a6e73">⋮</text>
  <line x1="64" y1="486" x2="1136" y2="486" stroke="#e0e0e0"/>

  <text x="96" y="532" font-family="sans-serif" font-size="14" font-weight="700" fill="#151515">cert-manager</text>
  <text x="360" y="532" font-family="sans-serif" font-size="13" fill="#151515">cert-manager</text>
  <text x="530" y="532" font-family="sans-serif" font-size="13" fill="#151515">v1.15.3</text>
  <rect x="640" y="514" width="96" height="24" rx="12" fill="#faeae8"/>
  <text x="656" y="530" font-family="sans-serif" font-size="12" fill="#8a1207">Failed</text>
  <text x="830" y="532" font-family="sans-serif" font-size="13" fill="#151515">Automatic</text>
  <text x="1050" y="532" font-family="sans-serif" font-size="16" fill="#6a6e73">⋮</text>
  <line x1="64" y1="550" x2="1136" y2="550" stroke="#e0e0e0"/>

  <text x="96" y="596" font-family="sans-serif" font-size="14" font-weight="700" fill="#151515">kafka-operator</text>
  <text x="360" y="596" font-family="sans-serif" font-size="13" fill="#151515">operators</text>
  <text x="530" y="596" font-family="sans-serif" font-size="13" fill="#151515">v2.9.1</text>
  <rect x="640" y="578" width="96" height="24" rx="12" fill="#e7f5ec"/>
  <text x="656" y="594" font-family="sans-serif" font-size="12" fill="#1e4f18">Succeeded</text>
  <text x="830" y="596" font-family="sans-serif" font-size="13" fill="#151515">Manual</text>
  <text x="1050" y="596" font-family="sans-serif" font-size="16" fill="#6a6e73">⋮</text>

  <text x="72" y="662" font-family="sans-serif" font-size="12" fill="#6a6e73">点击 Operator 名称进入详情，可查看 CSV、安装计划与由该 Operator 管理的自定义资源。</text>

  <text x="48" y="694" font-family="sans-serif" font-size="11" fill="#8a8d90">示意图，仅用于说明页面结构与操作区域，不代表实际界面像素。</text>
</svg>
