<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">应用管理页面示意图</title>
  <desc id="desc">页面顶部为 Helm 应用、OperatorHub、已安装 Operators 三个入口卡片，下方为 Helm 应用发布列表。</desc>

  <rect width="1200" height="780" fill="#f3f4f6"/>

  <!-- Masthead -->
  <rect width="1200" height="56" fill="#151515"/>
  <text x="48" y="35" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">KDO Console</text>
  <text x="190" y="35" font-family="sans-serif" font-size="13" fill="#9aa0a6">管理员界面 / 应用管理</text>
  <circle cx="1104" cy="28" r="10" fill="#3c3f44"/>
  <circle cx="1146" cy="28" r="10" fill="#3c3f44"/>

  <!-- Heading -->
  <text x="48" y="106" font-family="sans-serif" font-size="28" font-weight="700" fill="#151515">应用管理</text>
  <text x="48" y="134" font-family="sans-serif" font-size="14" fill="#6a6e73">管理 Helm 应用、OperatorHub 订阅与已安装 Operators。</text>
  <rect x="948" y="86" width="204" height="36" rx="4" fill="#0066cc"/>
  <text x="984" y="109" font-family="sans-serif" font-size="14" fill="#ffffff">安装 Helm 应用</text>

  <!-- Entry cards -->
  <rect x="48" y="170" width="352" height="150" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <rect x="72" y="194" width="44" height="44" rx="6" fill="#e7f1fa"/>
  <text x="87" y="223" font-family="sans-serif" font-size="20" font-weight="700" fill="#004080">H</text>
  <text x="72" y="264" font-family="sans-serif" font-size="16" font-weight="700" fill="#151515">Helm 应用</text>
  <text x="72" y="288" font-family="sans-serif" font-size="12" fill="#6a6e73">通过 Chart 部署中间件与第三方服务</text>
  <text x="72" y="308" font-family="sans-serif" font-size="12" fill="#0066cc">进入 →</text>

  <rect x="424" y="170" width="352" height="150" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <rect x="448" y="194" width="44" height="44" rx="6" fill="#e7f1fa"/>
  <text x="463" y="223" font-family="sans-serif" font-size="20" font-weight="700" fill="#004080">O</text>
  <text x="448" y="264" font-family="sans-serif" font-size="16" font-weight="700" fill="#151515">OperatorHub</text>
  <text x="448" y="288" font-family="sans-serif" font-size="12" fill="#6a6e73">浏览并订阅 Operator，扩展集群 API</text>
  <text x="448" y="308" font-family="sans-serif" font-size="12" fill="#0066cc">进入 →</text>

  <rect x="800" y="170" width="352" height="150" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <rect x="824" y="194" width="44" height="44" rx="6" fill="#e7f5ec"/>
  <text x="839" y="223" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e4f18">✓</text>
  <text x="824" y="264" font-family="sans-serif" font-size="16" font-weight="700" fill="#151515">已安装 Operators</text>
  <text x="824" y="288" font-family="sans-serif" font-size="12" fill="#6a6e73">查看版本、CSV 状态与 CR 实例</text>
  <text x="824" y="308" font-family="sans-serif" font-size="12" fill="#0066cc">进入 →</text>

  <!-- Helm release list -->
  <rect x="48" y="336" width="1104" height="352" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="72" y="368" font-family="sans-serif" font-size="17" font-weight="700" fill="#151515">Helm 应用发布</text>
  <text x="1020" y="368" font-family="sans-serif" font-size="13" fill="#0066cc">查看全部 →</text>

  <rect x="64" y="388" width="1072" height="34" fill="#f0f0f0"/>
  <text x="96" y="410" font-family="sans-serif" font-size="12" font-weight="700" fill="#6a6e73">名称</text>
  <text x="380" y="410" font-family="sans-serif" font-size="12" font-weight="700" fill="#6a6e73">命名空间</text>
  <text x="560" y="410" font-family="sans-serif" font-size="12" font-weight="700" fill="#6a6e73">版本</text>
  <text x="700" y="410" font-family="sans-serif" font-size="12" font-weight="700" fill="#6a6e73">状态</text>
  <text x="880" y="410" font-family="sans-serif" font-size="12" font-weight="700" fill="#6a6e73">更新时间</text>
  <text x="1080" y="410" font-family="sans-serif" font-size="12" font-weight="700" fill="#6a6e73">操作</text>

  <text x="96" y="468" font-family="sans-serif" font-size="14" font-weight="700" fill="#151515">mysql</text>
  <text x="380" y="468" font-family="sans-serif" font-size="13" fill="#151515">middleware</text>
  <text x="560" y="468" font-family="sans-serif" font-size="13" fill="#151515">8.0.36</text>
  <rect x="700" y="450" width="76" height="24" rx="12" fill="#e7f5ec"/>
  <text x="716" y="466" font-family="sans-serif" font-size="12" fill="#1e4f18">Running</text>
  <text x="880" y="468" font-family="sans-serif" font-size="13" fill="#6a6e73">2026-11-08 10:12</text>
  <text x="1092" y="468" font-family="sans-serif" font-size="16" fill="#6a6e73">⋮</text>
  <line x1="64" y1="488" x2="1136" y2="488" stroke="#e0e0e0"/>

  <text x="96" y="530" font-family="sans-serif" font-size="14" font-weight="700" fill="#151515">redis</text>
  <text x="380" y="530" font-family="sans-serif" font-size="13" fill="#151515">middleware</text>
  <text x="560" y="530" font-family="sans-serif" font-size="13" fill="#151515">7.2.4</text>
  <rect x="700" y="512" width="76" height="24" rx="12" fill="#e7f5ec"/>
  <text x="716" y="528" font-family="sans-serif" font-size="12" fill="#1e4f18">Running</text>
  <text x="880" y="530" font-family="sans-serif" font-size="13" fill="#6a6e73">2026-11-06 16:40</text>
  <text x="1092" y="530" font-family="sans-serif" font-size="16" fill="#6a6e73">⋮</text>
  <line x1="64" y1="550" x2="1136" y2="550" stroke="#e0e0e0"/>

  <text x="96" y="592" font-family="sans-serif" font-size="14" font-weight="700" fill="#151515">kafka</text>
  <text x="380" y="592" font-family="sans-serif" font-size="13" fill="#151515">middleware</text>
  <text x="560" y="592" font-family="sans-serif" font-size="13" fill="#151515">3.7.0</text>
  <rect x="700" y="574" width="76" height="24" rx="12" fill="#fdf3e3"/>
  <text x="716" y="590" font-family="sans-serif" font-size="12" fill="#7a5200">Pending</text>
  <text x="880" y="592" font-family="sans-serif" font-size="13" fill="#6a6e73">2026-11-09 09:05</text>
  <text x="1092" y="592" font-family="sans-serif" font-size="16" fill="#6a6e73">⋮</text>

  <text x="72" y="648" font-family="sans-serif" font-size="12" fill="#6a6e73">Helm 应用由管理员维护仓库与默认 values，安装后可在列表中升级、回滚或卸载。</text>

  <!-- Footer -->
  <text x="48" y="752" font-family="sans-serif" font-size="11" fill="#8a8d90">示意图，仅用于说明页面结构与操作区域，不代表实际界面像素。</text>
</svg>
