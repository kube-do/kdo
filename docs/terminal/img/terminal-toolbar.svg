<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">CloudShell 终端与 LocalShell 入口示意图</title>
  <desc id="desc">页面上方为 CloudShell 终端窗口，包含集群与命名空间选择、多标签、上传下载按钮和终端输出；下方为 LocalShell 登录步骤与网络权限说明。</desc>

  <rect width="1200" height="920" fill="#f3f4f6"/>

  <!-- Masthead -->
  <rect width="1200" height="56" fill="#151515"/>
  <text x="32" y="34" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">KDO 控制台</text>
  <text x="180" y="34" font-family="sans-serif" font-size="12" fill="#c9ccd1">主页</text>
  <text x="240" y="34" font-family="sans-serif" font-size="12" fill="#c9ccd1">工作负载</text>
  <text x="320" y="34" font-family="sans-serif" font-size="12" fill="#c9ccd1">终端</text>
  <circle cx="1104" cy="28" r="10" fill="#3c3f44"/>
  <circle cx="1146" cy="28" r="10" fill="#3c3f44"/>

  <!-- Heading -->
  <text x="48" y="112" font-family="sans-serif" font-size="28" font-weight="700" fill="#151515">命令行 CloudShell</text>
  <text x="48" y="142" font-family="sans-serif" font-size="14" fill="#6a6e73">集群内终端会话、多标签与文件传输；LocalShell 通过 oc login 接入</text>

  <rect x="1010" y="120" width="142" height="30" rx="15" fill="#e7f5ec" stroke="#3e8635"/>
  <text x="1030" y="140" font-family="sans-serif" font-size="11" fill="#1e4f18">2 个终端会话</text>

  <!-- Terminal window -->
  <rect x="48" y="164" width="1104" height="540" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <rect x="48" y="164" width="1104" height="48" rx="6" fill="#f5f5f5"/>
  <line x1="48" y1="212" x2="1152" y2="212" stroke="#e0e0e0"/>

  <circle cx="68" cy="188" r="5" fill="#c9190b"/>
  <circle cx="84" cy="188" r="5" fill="#c58c00"/>
  <circle cx="100" cy="188" r="5" fill="#3e8635"/>

  <rect x="124" y="176" width="180" height="26" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="136" y="193" font-family="sans-serif" font-size="11" fill="#151515">集群：prod-cluster</text>
  <text x="288" y="193" font-family="sans-serif" font-size="10" fill="#6a6e73">▾</text>

  <rect x="316" y="176" width="190" height="26" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="328" y="193" font-family="sans-serif" font-size="11" fill="#151515">命名空间：kubernetes-terminal</text>
  <text x="490" y="193" font-family="sans-serif" font-size="10" fill="#6a6e73">▾</text>

  <rect x="524" y="164" width="120" height="48" fill="#ffffff"/>
  <line x1="524" y1="210" x2="644" y2="210" stroke="#0066cc" stroke-width="2"/>
  <text x="548" y="193" font-family="sans-serif" font-size="12" font-weight="700" fill="#151515">terminal-1</text>

  <text x="676" y="193" font-family="sans-serif" font-size="12" fill="#6a6e73">terminal-2</text>
  <text x="772" y="193" font-family="sans-serif" font-size="16" fill="#6a6e73">+</text>

  <rect x="920" y="174" width="70" height="28" rx="4" fill="#ffffff" stroke="#0066cc"/>
  <text x="940" y="193" font-family="sans-serif" font-size="11" fill="#0066cc">上传</text>
  <rect x="998" y="174" width="70" height="28" rx="4" fill="#ffffff" stroke="#0066cc"/>
  <text x="1018" y="193" font-family="sans-serif" font-size="11" fill="#0066cc">下载</text>
  <rect x="1076" y="174" width="56" height="28" rx="4" fill="#ffffff" stroke="#0066cc"/>
  <text x="1090" y="193" font-family="sans-serif" font-size="11" fill="#0066cc">全屏</text>

  <!-- Terminal body -->
  <rect x="48" y="212" width="1104" height="492" fill="#151515"/>

  <text x="72" y="244" font-family="monospace" font-size="13" fill="#a5d6a5">$ kubectl get pods -n kubernetes-terminal</text>
  <text x="72" y="270" font-family="monospace" font-size="12" fill="#9aa0a6">NAME</text>
  <text x="340" y="270" font-family="monospace" font-size="12" fill="#9aa0a6">READY</text>
  <text x="420" y="270" font-family="monospace" font-size="12" fill="#9aa0a6">STATUS</text>
  <text x="520" y="270" font-family="monospace" font-size="12" fill="#9aa0a6">AGE</text>
  <text x="72" y="294" font-family="monospace" font-size="12" fill="#d2d2d2">terminal-7d9f8c-abcde</text>
  <text x="340" y="294" font-family="monospace" font-size="12" fill="#d2d2d2">1/1</text>
  <text x="420" y="294" font-family="monospace" font-size="12" fill="#a5d6a5">Running</text>
  <text x="520" y="294" font-family="monospace" font-size="12" fill="#d2d2d2">12m</text>

  <text x="72" y="326" font-family="monospace" font-size="13" fill="#a5d6a5">$ oc get route -n kubedo-system</text>
  <text x="72" y="352" font-family="monospace" font-size="12" fill="#9aa0a6">NAME</text>
  <text x="240" y="352" font-family="monospace" font-size="12" fill="#9aa0a6">HOST/PORT</text>
  <text x="480" y="352" font-family="monospace" font-size="12" fill="#9aa0a6">SERVICES</text>
  <text x="72" y="376" font-family="monospace" font-size="12" fill="#d2d2d2">console</text>
  <text x="240" y="376" font-family="monospace" font-size="12" fill="#d2d2d2">console.example.com</text>
  <text x="480" y="376" font-family="monospace" font-size="12" fill="#d2d2d2">console</text>

  <text x="72" y="408" font-family="monospace" font-size="13" fill="#a5d6a5">$ hermes gateway restart</text>
  <text x="72" y="432" font-family="monospace" font-size="12" fill="#a5d6a5">gateway restarted</text>
  <text x="72" y="464" font-family="monospace" font-size="13" fill="#a5d6a5">$ ls /home/user/work</text>
  <text x="72" y="488" font-family="monospace" font-size="12" fill="#d2d2d2">logs  config  deploy.yaml</text>
  <rect x="72" y="504" width="8" height="16" fill="#d2d2d2"/>

  <line x1="48" y1="640" x2="1152" y2="640" stroke="#3c3f44"/>
  <text x="72" y="668" font-family="sans-serif" font-size="11" fill="#9aa0a6">已连接 prod-cluster · 平台账号权限 · CPU 1 核 / 内存 1 GiB / 临时存储 1 GiB / 持久化 5 GiB</text>

  <!-- LocalShell card -->
  <rect x="48" y="724" width="540" height="150" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="68" y="754" font-family="sans-serif" font-size="15" font-weight="700" fill="#151515">LocalShell 登录</text>
  <text x="68" y="780" font-family="sans-serif" font-size="12" fill="#151515">1. 右上角用户菜单 → 复制登录命令</text>
  <text x="68" y="802" font-family="monospace" font-size="11" fill="#004080">2. oc login --token=sha256~xxxxx --server=https://api...</text>
  <text x="68" y="824" font-family="sans-serif" font-size="12" fill="#151515">3. 浏览器完成 OAuth 后写入本地 kubeconfig</text>
  <text x="68" y="848" font-family="sans-serif" font-size="11" fill="#6a6e73">oc 含登录能力，登录后 kubectl 命令同样可用</text>

  <!-- Network and permission card -->
  <rect x="612" y="724" width="540" height="150" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="632" y="754" font-family="sans-serif" font-size="15" font-weight="700" fill="#151515">网络与权限</text>
  <text x="632" y="780" font-family="sans-serif" font-size="12" fill="#3e8635">集群内 Service 与 API Server 默认可达</text>
  <text x="632" y="802" font-family="sans-serif" font-size="12" fill="#c58c00">外部网络取决于命名空间出口网络策略</text>
  <text x="632" y="824" font-family="sans-serif" font-size="12" fill="#151515">会话关闭后持久化目录保留，新会话重新创建</text>
  <text x="632" y="848" font-family="sans-serif" font-size="11" fill="#6a6e73">终端权限与 KDO 平台账号一致，可跨集群切换</text>

  <!-- Footer hint -->
  <text x="48" y="898" font-family="sans-serif" font-size="11" fill="#8a8d90">示意图，仅用于说明页面结构与操作区域，不代表实际界面像素。</text>
</svg>
