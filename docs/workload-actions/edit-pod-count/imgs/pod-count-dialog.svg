<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">编辑副本数弹窗示意图</title>
  <desc id="desc">弹窗展示当前副本与就绪状态，提供目标副本数输入框与步进按钮，并提示 HPA 与 PDB 的影响。</desc>

  <rect width="1200" height="720" fill="#f3f4f6"/>

  <text x="48" y="64" font-family="sans-serif" font-size="26" font-weight="700" fill="#151515">编辑副本数弹窗</text>
  <text x="48" y="92" font-family="sans-serif" font-size="13" fill="#6a6e73">调整 Deployment 或 StatefulSet 的目标副本数，控制器按更新策略滚动调整 Pod。</text>

  <rect x="300" y="116" width="600" height="480" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="332" y="160" font-family="sans-serif" font-size="20" font-weight="700" fill="#151515">编辑副本数</text>
  <text x="332" y="182" font-family="sans-serif" font-size="12" fill="#6a6e73">myapp · Deployment · kdo/dev</text>
  <text x="864" y="160" font-family="sans-serif" font-size="18" fill="#6a6e73">×</text>
  <line x1="300" y1="200" x2="900" y2="200" stroke="#e0e0e0"/>

  <rect x="332" y="220" width="536" height="64" rx="6" fill="#f5f9ff"/>
  <text x="352" y="246" font-family="sans-serif" font-size="13" font-weight="700" fill="#151515">当前副本数 3</text>
  <text x="352" y="268" font-family="sans-serif" font-size="12" fill="#6a6e73">就绪副本 3 / 3 · 更新策略 RollingUpdate · 已启用 PDB</text>
  <rect x="756" y="236" width="92" height="26" rx="13" fill="#e7f5ec"/>
  <text x="772" y="253" font-family="sans-serif" font-size="12" fill="#1e4f18">运行正常</text>

  <text x="332" y="322" font-family="sans-serif" font-size="12" font-weight="700" fill="#6a6e73">目标副本数</text>
  <rect x="332" y="334" width="180" height="44" rx="4" fill="#ffffff" stroke="#0066cc" stroke-width="2"/>
  <text x="352" y="363" font-family="sans-serif" font-size="18" font-weight="700" fill="#151515">5</text>
  <rect x="512" y="334" width="40" height="44" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="527" y="362" font-family="sans-serif" font-size="16" fill="#151515">−</text>
  <rect x="552" y="334" width="40" height="44" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="566" y="362" font-family="sans-serif" font-size="16" fill="#151515">+</text>
  <text x="612" y="361" font-family="sans-serif" font-size="12" fill="#6a6e73">正整数值，0 表示停止工作负载</text>

  <rect x="332" y="400" width="536" height="64" rx="4" fill="#fdf3e3" stroke="#f0ab00"/>
  <text x="348" y="424" font-family="sans-serif" font-size="12" fill="#7a5200">! 已启用 HPA 时副本数由 HPA 管理，手动编辑入口不会显示。</text>
  <text x="348" y="446" font-family="sans-serif" font-size="12" fill="#7a5200">缩容会按 StatefulSet 顺序删除 Pod，PVC 不会被删除。</text>

  <text x="332" y="492" font-family="sans-serif" font-size="12" fill="#6a6e73">预计新增 2 个 Pod；PDB minAvailable=2，缩容到 1 时可能被阻止。</text>

  <rect x="676" y="524" width="96" height="38" rx="4" fill="#ffffff" stroke="#0066cc"/>
  <text x="704" y="548" font-family="sans-serif" font-size="13" fill="#0066cc">取消</text>
  <rect x="784" y="524" width="84" height="38" rx="4" fill="#0066cc"/>
  <text x="808" y="548" font-family="sans-serif" font-size="13" fill="#ffffff">添加</text>

  <text x="48" y="700" font-family="sans-serif" font-size="11" fill="#8a8d90">示意图，仅用于说明页面结构与操作区域，不代表实际界面像素。</text>
</svg>
