<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">添加存储弹窗示意图</title>
  <desc id="desc">弹窗包含存储来源选择、持久卷声明、挂载路径、子路径、读写模式、挂载容器与确认按钮。</desc>

  <rect width="1200" height="900" fill="#f3f4f6"/>

  <text x="48" y="64" font-family="sans-serif" font-size="26" font-weight="700" fill="#151515">添加存储弹窗</text>
  <text x="48" y="92" font-family="sans-serif" font-size="13" fill="#6a6e73">为工作负载选择现有 PVC 或创建新 PVC，并配置挂载路径、子路径与读写模式。</text>

  <rect x="180" y="120" width="840" height="700" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="212" y="164" font-family="sans-serif" font-size="20" font-weight="700" fill="#151515">添加存储</text>
  <text x="984" y="164" font-family="sans-serif" font-size="18" fill="#6a6e73">×</text>
  <line x1="180" y1="186" x2="1020" y2="186" stroke="#e0e0e0"/>

  <text x="212" y="216" font-family="sans-serif" font-size="12" font-weight="700" fill="#6a6e73">存储来源</text>

  <rect x="212" y="228" width="380" height="64" rx="6" fill="#f5f9ff" stroke="#0066cc"/>
  <circle cx="240" cy="260" r="8" fill="#0066cc"/>
  <circle cx="240" cy="260" r="3" fill="#ffffff"/>
  <text x="262" y="253" font-family="sans-serif" font-size="14" font-weight="700" fill="#151515">使用现有持久卷声明</text>
  <text x="262" y="275" font-family="sans-serif" font-size="11" fill="#6a6e73">从当前命名空间选择已 Bound 的 PVC</text>

  <rect x="612" y="228" width="380" height="64" rx="6" fill="#ffffff" stroke="#d2d2d2"/>
  <circle cx="640" cy="260" r="8" fill="#ffffff" stroke="#8a8d90"/>
  <text x="662" y="253" font-family="sans-serif" font-size="14" fill="#151515">创建新的持久卷声明</text>
  <text x="662" y="275" font-family="sans-serif" font-size="11" fill="#6a6e73">填写 StorageClass、访问模式与大小</text>

  <text x="212" y="320" font-family="sans-serif" font-size="12" font-weight="700" fill="#6a6e73">持久卷声明</text>
  <rect x="212" y="330" width="500" height="38" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="226" y="354" font-family="sans-serif" font-size="13" fill="#151515">myapp-data-pvc · Bound · 10Gi</text>
  <text x="690" y="354" font-family="sans-serif" font-size="11" fill="#6a6e73">▾</text>
  <rect x="730" y="330" width="110" height="38" rx="4" fill="#e7f5ec"/>
  <text x="748" y="354" font-family="sans-serif" font-size="12" fill="#1e4f18">状态 Bound</text>

  <text x="212" y="402" font-family="sans-serif" font-size="12" font-weight="700" fill="#6a6e73">挂载路径</text>
  <rect x="212" y="412" width="240" height="38" rx="4" fill="#ffffff" stroke="#0066cc"/>
  <text x="226" y="436" font-family="sans-serif" font-size="13" fill="#151515">/data</text>
  <text x="480" y="402" font-family="sans-serif" font-size="12" font-weight="700" fill="#6a6e73">子路径（可选）</text>
  <rect x="480" y="412" width="220" height="38" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="494" y="436" font-family="sans-serif" font-size="13" fill="#151515">logs</text>
  <text x="720" y="436" font-family="sans-serif" font-size="11" fill="#6a6e73">实际挂载 PVC 的 /data/logs 目录</text>

  <text x="212" y="484" font-family="sans-serif" font-size="12" font-weight="700" fill="#6a6e73">读写模式</text>
  <rect x="212" y="494" width="160" height="38" rx="4" fill="#f5f9ff" stroke="#0066cc"/>
  <text x="228" y="518" font-family="sans-serif" font-size="12" fill="#004080">ReadWriteOnce</text>
  <rect x="386" y="494" width="150" height="38" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="402" y="518" font-family="sans-serif" font-size="12" fill="#151515">ReadOnlyMany</text>
  <rect x="550" y="494" width="150" height="38" rx="4" fill="#ffffff" stroke="#d2d2d2"/>
  <text x="566" y="518" font-family="sans-serif" font-size="12" fill="#151515">ReadWriteMany</text>
  <text x="724" y="518" font-family="sans-serif" font-size="11" fill="#6a6e73">多副本同时写入需要 RWX</text>

  <line x1="212" y1="558" x2="988" y2="558" stroke="#f0f0f0"/>

  <text x="212" y="590" font-family="sans-serif" font-size="13" font-weight="700" fill="#151515">挂载容器</text>
  <rect x="212" y="606" width="16" height="16" rx="3" fill="#0066cc"/>
  <text x="222" y="618" font-family="sans-serif" font-size="10" fill="#ffffff">✓</text>
  <text x="238" y="619" font-family="sans-serif" font-size="13" fill="#151515">myapp</text>
  <rect x="330" y="606" width="16" height="16" rx="3" fill="#ffffff" stroke="#8a8d90"/>
  <text x="356" y="619" font-family="sans-serif" font-size="13" fill="#151515">sidecar</text>
  <text x="450" y="619" font-family="sans-serif" font-size="11" fill="#6a6e73">多容器 Pod 可为每个容器单独设置挂载路径</text>

  <rect x="212" y="648" width="776" height="58" rx="4" fill="#fdf3e3" stroke="#f0ab00"/>
  <text x="228" y="672" font-family="sans-serif" font-size="12" fill="#7a5200">注意：使用现有 PVC 时，平台不会修改其访问模式。</text>
  <text x="228" y="692" font-family="sans-serif" font-size="12" fill="#7a5200">若 StorageClass 不支持 ReadWriteMany，多副本同时写入会失败。</text>

  <rect x="760" y="744" width="100" height="38" rx="4" fill="#ffffff" stroke="#0066cc"/>
  <text x="792" y="768" font-family="sans-serif" font-size="13" fill="#0066cc">取消</text>
  <rect x="876" y="744" width="112" height="38" rx="4" fill="#0066cc"/>
  <text x="910" y="768" font-family="sans-serif" font-size="13" fill="#ffffff">确定</text>

  <text x="48" y="882" font-family="sans-serif" font-size="11" fill="#8a8d90">示意图，仅用于说明页面结构与操作区域，不代表实际界面像素。</text>
</svg>
